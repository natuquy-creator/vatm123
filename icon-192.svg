<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c14b"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <!-- Gold ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ring)" stroke-width="8"/>
  <!-- Inner white circle -->
  <circle cx="256" cy="256" r="200" fill="#ffffff"/>
  <!-- Blue core -->
  <circle cx="256" cy="256" r="160" fill="#1d4ed8"/>
  <!-- Radar arcs -->
  <path d="M 140 200 A 120 120 0 0 1 372 200" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 160 220 A 100 100 0 0 1 352 220" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 180 240 A 80 80 0 0 1 332 240" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Airplane / star center -->
  <path d="M 256 130 L 272 200 L 330 210 L 272 220 L 268 255 L 285 268 L 256 260 L 227 268 L 244 255 L 240 220 L 182 210 L 240 200 Z" fill="#ffffff"/>
  <!-- Landing / base shape -->
  <path d="M 180 300 L 256 370 L 332 300 L 300 300 L 256 345 L 212 300 Z" fill="#ffffff"/>
  <!-- VATM text subtle at bottom of blue core -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="36" fill="#1d4ed8">VATM</text>
</svg>
